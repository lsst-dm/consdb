[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "consdb"
description = "consdb provides support for the Consolidated Database for the `Vera C. Rubin Observatory <https://lsst.org>`_."
license = { text = "GPL" }
dependencies = ["fastapi", "requests", "sqlalchemy", "astropy"]
readme = "README.rst"
dynamic = ["version"]

[project.urls]
Homepage = "https://consdb.lsst.io"
Source = "https://github.com/lsst-dm/consdb"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]
write_to = "python/lsst/consdb/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
log_level = "DEBUG"
asyncio_mode = "auto"

[project.optional-dependencies]
test = ["pytest"]
dev = [
    "documenteer[guide]",
]

[tool.ruff.format]

[tool.ruff.lint]
extend-select = ["E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.isort]
# The top-level alembic/ migrations directory shadows the Alembic library's
# name; without this, its imports are classified (and sorted) as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"python/lsst/consdb/transformed_efd/**" = ["BLE001"]
"alembic/*/versions/*" = ["E501", "W505"]
